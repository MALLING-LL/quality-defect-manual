<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中铁二局五公司质量通病防治手册 - 在线查询</title>
<style>
  :root {
    --bg: #f4f7f9;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --primary: #2563eb;
    
    --defect-bg: #fff1f2;
    --defect-border: #fecdd3;
    --defect-title: #be123c;
    
    --standard-bg: #eff6ff;
    --standard-border: #bfdbfe;
    --standard-title: #1d4ed8;
    
    --control-bg: #f0fdf4;
    --control-border: #bbf7d0;
    --control-title: #15803d;
    
    --hl-bg: #fef08a;
    --hl-text: #854d0e;

    /* 全局基础字号变量，默认14px */
    --base-size: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    line-height: 1.6;
    font-size: var(--base-size);
    -webkit-font-smoothing: antialiased;
    /* 移除 flex 布局，使用常规流，避免某些浏览器下 sticky 失效 */
    display: block;
    min-height: 100vh;
  }

  /* ==========================================
     顶部固定栏（红框部分：标题、字体调整、意见反馈）
     ========================================== */
  .header-sticky {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 100; /* 确保层级高于下方内容 */
    color: #fff;
    /* 使用与渐变背景相近的深蓝色并添加毛玻璃效果 */
    background: rgba(30, 58, 138, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    width: 100%;
    position: relative;
  }

  /* 标题行（居中标题，右侧工具） */
  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 40px;
  }
  .header-title h1 { 
    font-size: calc(var(--base-size) * 2.5); 
    font-weight: 800; 
    letter-spacing: 2px; 
    margin: 0;
    text-align: center;
  }

  /* 右上角工具组（字体控制 + 意见反馈，水平排列） */
  .header-tools {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
  }

  /* 字体大小控制面板 */
  .font-control {
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(4px);
    padding: 3px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    height: 34px; /* 统一高度 */
  }
  .font-control button {
    background: transparent;
    border: none;
    border-radius: 5px;
    width: 30px;
    height: 26px;
    cursor: pointer;
    font-weight: 800;
    font-size: 13px;
    color: #fff;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  .font-control button:hover {
    background: rgba(255, 255, 255, 0.25);
  }
  .font-control button:active {
    background: rgba(255, 255, 255, 0.4);
  }

  /* 意见反馈按钮（尺寸完全对齐字体面板） */
  .feedback-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    padding: 0 14px;
    height: 34px;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .feedback-btn:hover {
    background: rgba(255, 255, 255, 0.25);
  }
  .feedback-btn:active {
    background: rgba(255, 255, 255, 0.4);
  }

  /* ==========================================
     搜索与筛选区域（随页面滚动）
     ========================================== */
  .header-search-section {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    padding: 12px 20px 14px;
  }

  .header-search-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  /* 第一行：全局搜索框 */
  .search-box { 
    display: flex;
    align-items: center;
    width: 100%;
    gap: 12px;
  }
  .search-label {
    font-size: calc(var(--base-size) * 1);
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .search-input-wrap {
    position: relative; 
    flex: 1;
  }
  .search-input-wrap input {
    width: 100%; 
    padding: 8px 16px 8px 36px; 
    border: none; 
    border-radius: 8px;
    font-size: calc(var(--base-size) * 0.93); 
    font-family: inherit; 
    color: var(--text-main); 
    background: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); 
    transition: all 0.2s; 
    outline: none;
    height: 36px;
  }
  .search-input-wrap input:focus { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3); }
  .search-input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #94a3b8; pointer-events: none; }

  /* 第二行：分类筛选与局部搜索 */
  .filter-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    width: 100%;
  }
  .filter-label {
    font-size: calc(var(--base-size) * 1);
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .filter-group { display: flex; align-items: center; gap: 4px; }
  .filter-group label { font-size: calc(var(--base-size) * 0.86); font-weight: 600; color: #bfdbfe; white-space: nowrap; }
  .filter-group select {
    padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc;
    font-size: calc(var(--base-size) * 0.86); color: var(--text-main); outline: none; cursor: pointer; transition: all 0.2s; font-family: inherit;
    height: 34px;
  }
  .filter-group select:focus, .filter-group select:hover { border-color: #fff; background: #fff; }
  #filterItem { max-width: 220px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
  
  .filter-search-box { flex: 1; min-width: 150px; position: relative; }
  .filter-search-box input {
    width: 100%; padding: 6px 12px 6px 32px; border-radius: 6px; border: 1px solid #cbd5e1;
    font-size: calc(var(--base-size) * 0.86); outline: none; transition: all 0.2s; font-family: inherit;
    height: 34px;
  }
  .filter-search-box input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3); }
  .filter-search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: #94a3b8; }
  
  .reset-btn {
    background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 16px;
    border-radius: 6px; font-size: calc(var(--base-size) * 0.86); font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
    height: 34px;
  }
  .reset-btn:hover { background: rgba(255, 255, 255, 0.25); }

  /* ====== 内容区 ====== */
  .container { flex: 1; max-width: 1360px; width: 100%; margin: 0 auto; padding: 16px 16px 20px; }

  .stats { font-size: calc(var(--base-size) * 0.93); color: var(--text-muted); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }

  .card-list { display: flex; flex-direction: column; gap: 20px; }
  .card {
    background: var(--card-bg); border-radius: 14px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    border: 1px solid var(--border); overflow: hidden; transition: all 0.2s; 
    /* 锚点跳转时留出吸顶栏的高度 */
    scroll-margin-top: 80px;
  }
  .card:hover { box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); border-color: #cbd5e1; }

  .card-header {
    padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap;
    align-items: center; justify-content: space-between; gap: 12px; background: #fafcff;
  }
  .title-wrap { display: flex; align-items: center; gap: 12px; flex: 1; }
  .index-badge {
    background: linear-gradient(135deg, #2563eb, #0ea5e9); color: #fff; font-size: calc(var(--base-size) * 0.93); font-weight: 800;
    width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 2px 6px rgba(37,99,235,0.3);
  }
  .card-title { font-size: calc(var(--base-size) * 1.21); font-weight: 700; color: #0f172a; }

  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: calc(var(--base-size) * 0.86); padding: 4px 12px; border-radius: 6px; background: #f1f5f9; color: #475569;
    font-weight: 600; border: 1px solid #e2e8f0; display: inline-flex; align-items: center;
    justify-content: center; text-align: center; min-width: 76px; box-sizing: border-box; line-height: 1.2;
  }
  .tag.major { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .tag.chapter { background: #fdf4ff; color: #86198f; border-color: #f5d0fe; }
  .tag.section { background: #fffbeb; color: #b45309; border-color: #fde68a; }

  .card-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }

  .section { border-radius: 10px; padding: 20px; border: 1px solid; }
  .section-title { font-size: calc(var(--base-size) * 1.07); font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .section-title svg { width: 18px; height: 18px; }

  /* 默认布局：文字在左，图片在右 */
  .section-body-layout { 
    display: grid; 
    grid-template-columns: minmax(300px, 1fr) auto; 
    gap: 24px; 
    align-items: flex-start; 
  }
  .section-content { font-size: var(--base-size); color: #334155; line-height: 1.8; min-width: 0; }

  /* ====== 关键控制点：强制上下布局 ====== */
  .section.control .section-body-layout {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .section.control .img-group {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 20px;
    width: 100%;
  }

  /* 模块颜色定义 */
  .section.defect { background: var(--defect-bg); border-color: var(--defect-border); }
  .section.defect .section-title { color: var(--defect-title); }
  .section.defect svg { color: var(--defect-title); }

  .section.standard { background: var(--standard-bg); border-color: var(--standard-border); }
  .section.standard .section-title { color: var(--standard-title); }
  .section.standard svg { color: var(--standard-title); }

  .section.control { background: var(--control-bg); border-color: var(--control-border); }
  .section.control .section-title { color: var(--control-title); }
  .section.control svg { color: var(--control-title); }

  /* ====== 图片占位与真实样式 ====== */
  .img-group { display: flex; gap: 16px; flex-shrink: 0; }

  .img-placeholder {
    width: 480px; height: 342px; border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; box-sizing: border-box; transition: all 0.2s;
    max-width: 100%;
  }
  .section.defect .img-placeholder { background-color: rgba(255, 255, 255, 0.6); border: 2px dashed #fda4af; color: #be123c; }
  .section.control .img-placeholder { background-color: rgba(255, 255, 255, 0.6); border: 2px dashed #86efac; color: #15803d; }
  .img-placeholder .img-name { font-size: calc(var(--base-size) * 1.14); font-weight: 800; margin-bottom: 10px; letter-spacing: 0.5px; }
  .img-placeholder .img-size { font-size: calc(var(--base-size) * 0.86); background: rgba(255, 255, 255, 0.8); padding: 4px 14px; border-radius: 20px; border: 1px solid currentColor; font-weight: 600; opacity: 0.8; }

  .real-img {
    width: 480px; height: 342px; object-fit: cover; border-radius: 10px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1); border: 1px solid var(--border); 
    flex-shrink: 0; max-width: 100%; cursor: zoom-in;
    animation: fadeIn 0.4s ease-out;
  }
  .real-img:hover {
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
    filter: brightness(1.02);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  mark.hl { background-color: var(--hl-bg); color: var(--hl-text); padding: 0 3px; border-radius: 3px; font-weight: 700; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: 14px; border: 1px dashed #cbd5e1; display: none; }
  .empty-state svg { width: 48px; height: 48px; color: #cbd5e1; margin-bottom: 16px; }
  .empty-state h3 { color: #475569; margin-bottom: 8px; }

  .site-footer { text-align: center; padding: 24px 20px 30px; color: #94a3b8; font-size: calc(var(--base-size) * 0.93); font-weight: 500; letter-spacing: 1px; }
  .site-footer span { display: inline-flex; align-items: center; }
  .site-footer span::before, .site-footer span::after { content: ""; display: inline-block; width: 24px; height: 1px; background: #cbd5e1; margin: 0 12px; }

  /* ====== 意见反馈弹窗 ====== */
  .feedback-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.48);
    backdrop-filter: blur(3px);
  }
  .feedback-modal.is-open { display: flex; }

  .feedback-dialog {
    width: min(400px, 100%);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
    animation: feedbackIn 0.18s ease-out;
    overflow: hidden;
  }
  @keyframes feedbackIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .feedback-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 12px;
    border-bottom: 1px solid #e5e7eb;
  }
  .feedback-header h3 {
    margin: 0;
    font-size: 18px;
    color: #111827;
  }
  .feedback-close {
    border: none;
    background: transparent;
    font-size: 24px;
    line-height: 1;
    color: #6b7280;
    cursor: pointer;
  }

  /* 二维码展示区 */
  .feedback-qrcode-section {
    padding: 30px 20px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .feedback-qrcode-wrapper {
    width: 220px;
    height: 220px;
    padding: 10px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    margin-bottom: 16px;
  }

  .feedback-qrcode-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 8px;
  }

  .feedback-qrcode-tip {
    font-size: 15px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 20px;
  }

  .feedback-qrcode-divider {
    position: relative;
    width: 100%;
    text-align: center;
    margin-bottom: 20px;
    color: #9ca3af;
    font-size: 13px;
  }
  .feedback-qrcode-divider::before,
  .feedback-qrcode-divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: #e5e7eb;
  }
  .feedback-qrcode-divider::before { left: 0; }
  .feedback-qrcode-divider::after { right: 0; }

  .feedback-link-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 12px 20px;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    transition: background 0.2s;
  }
  .feedback-link-btn:hover {
    background: #1d4ed8;
  }

  /* ====== 返回顶部按钮 ====== */
  .back-to-top {
    position: fixed;
    right: 30px;
    bottom: 40px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #ffffff;
    color: #2563eb;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px);
    transition: all 0.3s ease;
  }
  .back-to-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .back-to-top:hover {
    background: #f8fafc;
    color: #1d4ed8;
    border-color: #bfdbfe;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
  }
  .back-to-top svg {
    width: 22px;
    height: 22px;
  }

  /* ====== 响应式适配 ====== */
  @media (max-width: 1150px) {
    .section-body-layout { grid-template-columns: 1fr; }
    .section.defect .img-group { 
      flex-direction: row; 
      flex-wrap: wrap; 
      margin-top: 10px;
    }
  }

  @media (max-width: 768px) {
    .header-sticky { padding: 10px 16px; }
    .header-search-section { padding: 10px 16px 14px; }
    
    .search-box { flex-direction: column; align-items: flex-start; gap: 6px; }
    .search-input-wrap { width: 100%; }
    .filter-panel { flex-direction: column; align-items: flex-start; gap: 8px; }
    .filter-group { width: 100%; justify-content: space-between; }
    .filter-group select { flex: 1; }
    .filter-search-box { width: 100%; }
    .reset-btn { width: 100%; }
    
    .card-header { flex-direction: column; align-items: flex-start; }
    .tags { margin-left: 40px; }
    .card-body { padding: 16px; }
    .section { padding: 16px; }
    .card { scroll-margin-top: 70px; }
    .site-footer { padding: 16px 20px 20px; }
    
    /* 移动端标题字体调整 */
    .header-title h1 { font-size: calc(var(--base-size) * 1.2); }
    .header-top { min-height: 36px; }
    .header-tools { gap: 6px; } 
    
    /* 移动端等比缩小整体尺寸，保持视觉一致 */
    .font-control { transform: scale(0.9); transform-origin: right center; }
    .feedback-btn { height: 30px; padding: 0 10px; font-size: 12px; font-weight: 800; }

    /* 返回顶部按钮移动端位置 */
    .back-to-top { right: 20px; bottom: 24px; width: 40px; height: 40px; }
    .back-to-top svg { width: 20px; height: 20px; }
  }

  @media (max-width: 600px) {
    .img-placeholder, .real-img { 
      width: 100% !important; 
      height: auto !important; 
      aspect-ratio: 480 / 342; 
    }
  }
</style>
</head>
<body>

<!-- 顶部吸顶部分（红框内容：标题、字体调整、意见反馈） -->
<div class="header-sticky">
  <div class="header-inner">
    <div class="header-top">
      <div class="header-title">
        <h1>中铁二局五公司质量通病防治手册</h1>
      </div>
      <div class="header-tools">
        <div class="font-control">
          <button id="font-decrease" title="缩小字体">A-</button>
          <button id="font-reset" title="默认字体">A</button>
          <button id="font-increase" title="放大字体">A+</button>
        </div>
        <button id="feedbackBtn" class="feedback-btn" type="button">意见反馈</button>
      </div>
    </div>
  </div>
</div>

<!-- 搜索与筛选区域（随页面滚动） -->
<div class="header-search-section">
  <div class="header-inner">
    <div class="header-search-area">
      
      <!-- 第一行：全局搜索 -->
      <div class="search-box">
        <span class="search-label">全局检索：</span>
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="globalSearchInput" placeholder="输入关键字查找所有内容...">
        </div>
      </div>

      <!-- 第二行：分类筛选与局部搜索 -->

    "standard": "《建筑施工承插型盘扣式钢管脚手架安全技术标准》JGJ/T 231-2021第6.2条：应根据支撑架搭设高度、支撑架型号及立杆轴向力设计值进行竖向斜杆布置，例如立杆轴力设计值30kN，支架搭设高度16m时，应间隔1跨布置竖向斜杆。",
    "control": "1.支撑架的高宽比宜控制在3以内，高宽比大于3的支撑架应与既有结构进行刚性连接或增加抗倾覆措施。<br>2.脚手架搭设步距不应超过2m，标准型立杆荷载设计值大于40kN时，顶层步距应比标准步距缩小0.5m。<br>3.支架可调托撑伸出顶层水平杆或双槽托梁中心线的长度不应超过650mm，且丝杆外露长度不应超过400mm。可调托撑插入立杆或双槽托梁长度不得小于150mm。<br>4.当支撑架搭设高度大于16m时，顶层步距内应每跨布置竖向斜杆。<br>5.支架的上、下部分配梁应与可调托撑中心对齐，避免造成支架偏心受压，降低支架承载力。<br>6.支架的竖斜杆剪刀撑应按规范及时安装布设，连接节点处插销必须锤击自锁，防止拔脱，确保节点牢固。"
  },
  {
    "id": 20,
    "major": "桥梁工程",

    "section": "支架工程",
    "title": "钢管立柱法兰连接精度差",
    "defect": "法兰接头加工精度差、焊接对位差，加入调节钢板导致传力不直接，法兰接头螺栓错孔导致扩孔或钢管偏心受力。<br>钢管接头的力学性能变差，承载力变小，非弹性变形大，立柱垂直度不满足规范要求。",
    "standard": "《钢结构工程施工质量验收标准》GB 50205-2020 第7.7.2 条：螺栓孔孔距范围≤500mm时，同一组内任意两孔间距离允许偏差为±1mm，相邻两组的端孔间距离允许偏差为±1.5mm；螺栓孔孔距为其他范围时，应满足相应规定。",
    "control": "1.钢管法兰接头应在场内加工，激光测量下料保障垂直度，严禁直接切割接头倒用。法兰接头应具备足够的刚度，可在钢管内增加劲板补强，焊接时采取措施减少焊接变形。<br>2.现场使用钢板调整法兰接头时，钢板对应加劲板应伸入钢管管径范围内一定面积，必要时可焊接。<br>3.支架宜采用装配化、定制化产品，确保精度，减少现场作业量。"
  },
  {

    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "支架工程",
    "title": "钢管节段焊缝不合格",
    "defect": "钢管对接偏心较大；焊接顺序错误导致截面削弱；焊缝出现咬边、夹渣、气孔、未熔透等缺陷；多次割焊导致钢管受损、接头多，形象差。<br>钢管接头的力学性能变差，承载能力变弱。",
    "standard": "《钢结构焊接规范》GB50661-2011 第5.1.5 条：不需要疲劳计算的构件中，凡要求与母材等强的对接焊缝宜予以熔透，当受拉时其质量等级不低于二级。<br>《钢结构工程施工质量验收标准》GB50205-2020 第5.2.6 条：焊缝表面不得有裂纹、焊瘤等缺陷。一级、二级焊缝不得有表面气孔、夹渣、弧坑裂纹、电弧擦伤等缺陷。",
    "control": "1.钢管现场对接焊应先测量垂直度、轴线、错边等，满足规范要求后用码板固定，施焊环缝，最后拼接板补强。<br>2.钢管对接开坡口应角度均匀、钝边适中，端面平整无毛刺，坡口及两侧除锈除污干净，组对错边量小、间隙一致，保证焊接根部熔合良好。<br>3.重要焊缝使用气体焊代替手把焊以提高焊缝质量。一级、二级焊缝按规范要求进行检测，焊缝质量合格后方可进行下一工序。<br>4.支架整体的钢管对接接头应错开50%。"
  },
  {
    "id": 22,
    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "支架工程",
    "title": "支架预压布载及分级不规范",
    "defect": "支架受荷后出现应力集中、变形过大。局部连接失效等。<br>支架的强度和刚度未得到充分检验，未消除非弹性变形，甚至垮塌。",
    "standard": "《高速铁路桥涵工程施工技术规程》Q/CR9603-2015第12.2.9条：支架应进行预压，以检测结构的承载能力和稳定性、消除非弹性变形、观测结构弹性变形及基础沉降情况。预压荷载应不小于最大施工荷载的1.1倍，按照60%、100%、110%分级加载。",
    "control": "1.应按照荷载分布情况，上压或下挂实施预压，预压荷载与施工期间荷载分布应基本一致，根据预压结果结合监控指令重新调整支架预拱度。<br>2.支架预压应对称、均匀、分层、分级加载和卸载，当沉降数据收敛后方可进行下一级加载。卸载按照加载倒序分级进行，卸载后复查支架构件和连接情况。<br>3.按规范要求布置支架沉降变形和应力监测的观测点，根据实际的观测数据检验设计计算结果和支架安装质量。<br>4.采用砂袋进行预压时，应做好覆盖防雨措施，避免雨水浸泡砂袋导致预压荷载超限。"
  },
  {
    "id": 23,
    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "预应力工程",
    "title": "预应力管道定位不准、不牢",
    "defect": "管道坐标偏差超限、线形不顺、接头脱开、固定不牢，导致混凝土浇筑时预应力管道上浮、侧移或局部破损漏浆。<br>预应力筋穿束困难、张拉伸长值异常、摩阻损失增大，导致有效预应力严重不均，结构受力性能下降，甚至引发管道堵塞，危及主体结构安全。",
    "standard": "《铁路混凝土工程施工技术规程》Q/CR 9207-2017 第7.3.3条：管道安装前，应按设计规定的管道坐标进行放样，并应采用定位钢筋固定法将管道牢固地置于钢筋骨架内的设计位置。定位钢筋在专用胎卡具上焊成井字形；每侧钢筋和管道间隙2mm；定位钢筋的间距，钢管不宜大于1m，金属预应力管道、橡胶棒不宜大于0.5m，曲线管道宜适当加密。",
    "control": "1.预应力管道安装前，认真复核图纸。按设计要求设置定位钢筋，曲线段应适当进行加密定位筋间距。定位筋与结构钢筋点焊应牢固，确保浇筑振捣时管道不发生移位或上浮。<br>2.若预应力管道曲线受主体结构骨架钢筋干扰，应与设计单位共同商定调整方案，不得擅自割断或移位主体结构骨架钢筋。<br>3.预应力管道宜在主体结构骨架钢筋基本安装完成后再穿入，避免后续安装钢筋引起定位筋的松动与移位。<br>4.混凝土浇筑时应安排专人监管，检查管道位置及完好性，防止振捣棒直接碰撞预应力管道。"
  },
  {
    "id": 24,
    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "预应力工程",
    "title": "预应力管道连接不牢、不密封或烧蚀破损",
    "defect": "预应力管道连接不牢固、密封效果不好，或因邻近钢筋焊接作业的电焊灼伤，管壁出现孔洞、破损及开裂，局部变形缺损，完整性遭到破坏。<br>导致水泥浆渗入管道，造成管道堵塞或钢绞线被包裹，使得预应力摩阻损失增大;后续管道灌浆不饱满、不密实，严重影响有效预应力的建立与结构耐久性。",
    "standard": "《铁路混凝土工程施工技术规程》Q/CR 9207-2017 第7.3.3条:金属管道接头处的连接管宜采用大一个直径级别的同材质管道,其长度移位被连接管道内径的5～7倍,且不小于300mm,两端旋入长度应大致相等。管道在模板内安装完毕后,应将其端部封堵,防止水或其他杂物进入。",
    "control": "1.应尽量先完成钢筋焊接作业,再安装预应力管道,从根本上避免电焊损伤。<br>2.若必须在预应力管道安装后进行焊接,则必须在焊接部位设置隔档板,或在预应力管道上方及周围铺设防火毯、铁皮等可靠阻燃材料,防止高温熔渣灼伤管壁。<br>3.预应力管道接头处采用专用连接管旋紧,并使用防水胶带严密缠绕密封,防止水泥浆渗入。<br>4.施工过程中应加强对预应力管道的保护,防止机械碰撞。在混凝土浇筑前(隐蔽前),应逐段检查预应力管道外观,发现连接不牢、密封不严或烧蚀破损时,必须及时修补或更换,严禁带伤隐蔽。<br>5.混凝土初凝前,应用通孔器拉动疏通检查管道。若为预置预应力束,则应不时拉动预应力束,以保证预应力管道畅通。"
  },
  {
    "id": 25,
    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "预应力工程",
    "title": "锚垫板位置不准确、固定不牢",
    "defect": "锚垫板定位随意，与梁端模板不垂直、移位，锚垫板后方混凝土空洞；锚垫板与模板之间有缝隙、不密贴；压浆孔未固定在上方。<br>造成预应力张拉偏心、钢绞线应力集中，压浆不饱满，导致锚下混凝土开裂、锚口预应力摩阻增大，严重影响结构耐久性与安全。",
    "standard": "《混凝土结构工程施工质量验收规范》GB50204-2015第6.3.4条：锚垫板的承压面应与预应力筋或孔道曲线末端垂直。<br>《铁路工程预应力筋用夹片式锚具、夹具和连接器》TB/T3193-2016第5.5.4条：锚垫板底口直径与橡胶抽拔管直径配合间隙不宜大于5mm，锚垫板止口端面的平面度不应大于0.5mm。",
    "control": "1.使用专用定位装置，确保锚垫板中心与预应力管道中心精确对中。锚垫板应通过螺栓（钢模）或可靠绑扎（木模）与端模板牢固固定，严禁单点固定或松动。<br>2.安装时，确保压浆孔定位于管道上方，以利排气和压浆饱满。<br>3.安装前，彻底清理模板与锚垫板的接触面，确保无杂物。紧固后，使用塞尺检查，确保缝隙≤0.5mm，超差处应重新处理。<br>4.锚垫板承压面须紧贴安装螺旋筋，并与预应力管道同心后固定，形成整体。<br>5.混凝土振捣时避免振动棒直接冲击锚垫板，同时要保证锚后区域振捣密实，避免空鼓。安排专人旁站，发现偏移及时校正。"
  },
  {
    "id": 26,
    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "预应力工程",
    "title": "预应力钢绞线锈蚀",
    "defect": "预应力钢绞线原材料、半成品存放不当发生锈蚀；先张法预应力钢绞线张拉后未及时浇筑混凝土发生锈蚀；后张法预应力钢绞线穿束过早或未采取有效保护措施、张拉后未及时压浆封锚发生锈蚀。<br>钢绞线锈蚀会显著削弱其有效截面积和力学性能，导致结构承载力与耐久性下降。",
    "standard": "《铁路混凝土工程施工技术规程》Q/CR 9207-2017 第7.4.1条：预应力材料必须保持清洁，在存放和搬运过程中应避免机械损伤和锈蚀。如进场后需长时间存放时，必须定期进行外观检查。第7.4.3条：锚具、夹具和连接器应按不同规格挂牌整齐堆放在通风良好的仓库中。在成品堆放、运输、装卸和施工期间要避免锈蚀、沾污、散失。",
    "control": "1.钢绞线原材料及半成品应在室内或棚内存放，下垫上盖，防止淋雨锈蚀。<br>2.先张法施工应尽量缩短钢绞线张拉与混凝土浇筑的间隔时间，钢绞线放张后应及时进行封端处理。<br>3.后张法施工宜尽量在临近张拉时下料穿束。穿束前应用空压机清理管道内可能残存的积水与杂物。穿束后、张拉前应对外露钢绞线采取必要的防锈保护措施。<br>4.后张法钢绞线在张拉后，须及时进行管道压浆和锚头封锚，隔绝腐蚀环境。<br>5.对于图纸要求的桥梁备用束、体外束等，必须按设计要求做好专门的防腐措施。"
  },
  {
    "id": 27,
    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "预应力工程",
    "title": "预应力张拉顺序、时机不符合要求",
    "defect": "构件张拉后出现侧弯、翘曲、端部开裂、沿预应力筋方向出现纵向裂缝，张拉伸长值偏差超标，甚至发生断丝、滑丝。导致预应力建立不均匀，结构产生附加内力，承载力下降；严重时引发构件失稳或断裂，危及结构安全与使用寿命。",
    "standard": "《铁路混凝土工程施工技术规程》Q/CR 9207-2017 第7.6.9条：预应力筋张拉或放张时的环境温度不宜低于0℃。<br>《铁路混凝土工程施工质量验收标准》TB 10424-2018 第7.4.2条：后张法预应力筋预张拉或初张拉时，混凝土强度应符合设计要求。设计无要求时，初张拉混凝土强度应达到设计强度的80%。",
    "control": "1.必须按设计张拉顺序要求进行。设计无要求时，应遵循分批、分阶段、对称、同步的原则，一般可按先中间后上下或两侧的顺序进行，避免构件偏心受力。<br>2.张拉时，结构混凝土的强度、弹性模量（或龄期）必须符合设计要求。设计无规定时，需满足规范要求。<br>3.预应力张拉达到控制应力后，应有足够的稳压持荷时间，以使预应力充分传递。<br>4.宜采用智能张拉系统，实现张拉过程自动控制与两端同步，确保张拉力精确、伸长量一致。<br>5.应以张拉力控制为主，伸长值校核为辅。"
  },
  {

    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "预应力工程",

  },
  {

    "major": "桥梁工程",
    "chapter": "通用工程",
    "section": "预应力工程",

    "standard": "《铁路混凝土工程施工质量验收标准》TB 10424-2018 第7.4.4条:预应力筋的实际伸长值与计算伸长值的差值不应大于±6%。",
    "control": "1.张拉前对千斤顶和压力表配套标定,周期不超6个月或200次。<br>2.必须采用实测的钢绞线弹性模量和预应力损失系数修正计算伸长值,严禁使用理论值。<br>3.按规范选取初应力,分级缓慢加载,达到控制应力后持荷时间不少于5min(长束适当延长)。<br>4.以张拉力控制为主,伸长值校核为辅。采用智能张拉或有效措施保证两端同步,两端伸长量之差不宜大于5%。<br>5.伸长值偏差超±6%时,必须暂停张拉。排查是否为孔道堵塞、摩阻剧增、计算参数错误或出现滑丝断丝,严禁通过超拉强行达到伸长量。"

    "standard": "《公路桥涵施工技术规范》JTG/T3650-2020第7.9.13条：压浆完成后，应及时对锚固端按设计要求进行封闭保护或防腐处理，需要封锚的锚具，应在压浆完成后对梁端混凝土凿毛并将其周围冲洗干净，设置钢筋网浇筑封锚混凝土；封锚应采用与结构或构件同强度的混凝土并应严格控制封锚后的梁体长度。如长期外露的锚具，应采取防锈措施。",

  {

    "defect": "原材料进场检测不及时、未检先用，检测项目缺项、漏检或检测频率不足，取样不规范、样品没有代表性，质量证明文件不全或缺失。<br>可能将不合格原材料用于混凝土生产，导致混凝土工作性能、力学性能、耐久性能等不满足标准或设计要求，容易引发混凝土质量问题甚至事故。",
    "standard": "《铁路混凝土工程施工质量验收标准》TB 10424-2018 第3.4.1条：原材料、构配件、半成品进场后，施工单位、监理单位相关人员按本标准及国家、行业相关标准的规定进行进场检验。<br>《铁路混凝土工程施工技术规程》Q/CR 9207-2017 第6.1.1条：混凝土工程所用原材料应按现行的相关施工质量验收标准进行进场验收，合格后方可使用。",
    "control": "1.建立严格的原材料进场检验制度，未经检测的原材料不得使用。<br>2.原材料进场后，核对产品出厂合格证、质量证明文件，各项指标应满足相关标准及设计要求。<br>3.对照标准及设计文件，认真核对检测项目，避免漏检或检测频率不足的情况。<br>4.原材料进场后，应在监理或业主代表见证下进行随机取样，取样须有代表性，不得刻意抽取质量好的部位或样品。<br>5.做好物资材料追溯和核销台账，提前规划材料进场计划，避免未检先用。<br>6.物资部门跟试验室之间应加强沟通协调，原材料进场后及时委托取样，及时检测并出具检测报告。"
  },
  {

    "standard": "《铁路混凝土工程施工技术规程》Q/CR 9207-2017 第6.7.1条：混凝土应分层浇筑，泵送混凝土的最大摊铺厚度不宜大于60cm，其他混凝土最大摊铺厚度不宜大于40cm。上下层同时浇筑时，上层与下层前后浇筑距离应保持1.5m以上。在倾斜面上浇筑混凝土时，应从低处开始逐层扩展升高，保持水平分层。",
    "control": "1.严格控制分层厚度，浇筑时建议控制泵送混凝土分层厚度不宜大于50cm，非泵送不宜大于30cm。<br>2.根据振捣棒有效作用半径及浇筑部位确定实际分层厚度。<br>3.控制浇筑速度，在下层混凝土初凝前完成上层浇筑，避免形成冷缝。<br>4.严格控制振捣插入深度，振捣上层时棒头插入下层50~100mm，确保界面结合密实。<br>5.随浇随振，每层混凝土边浇筑边振捣，严禁大面积堆积后再振捣和堆赶混凝土。"

    "control": "1.严格控制混凝土自由倾落高度，直接倾卸时，自由落高不应超过2m。<br>2.高度超过2m时，采用串桶、溜管或震动溜管，出料口距浇筑面不宜超过1m。<br>3.配合布料设备分层下料，避免单点集中堆积造成骨料滚落分离。<br>4.落差较大时宜适当提高砂率或掺加增粘剂，改善抗离析性能。<br>5.采用泵送或输送带直接布料时，应减少多次转运造成的离析累积。<br>6.现场专人监控落高及下料均匀性，发现离析立即调整布料方式。"

    "standard": "《铁路混凝土工程施工技术规程》Q/CR 9207-2017 第6.8.1 条: 混凝土浇筑过程中, 应随时对混凝土进行振捣并使其均匀密实。振捣宜采用插入式振捣器进行垂直点振, 或采用插入式和附着式振捣器进行联合振捣。第6.8.2 条: 混凝土振捣过程中, 应避免重复振捣, 防止过振。",

    "standard": "《建筑地基基础工程施工规范》GB 51004-2015 第6.3.3条：板桩打设宜采用振动锤，锤击时应在桩锤与板桩之间设置桩帽，打设时应重锤低击。第6.3.6条：钢板桩打入前应进行验收，桩体不应弯曲，锁口不应有缺损和变形，钢板桩锁口应通过套锁检查后再施工。",
    "control": "1. 详勘地质与预处理：施工前应查明地层中孤石、硬夹层等的分布情况。对存在坚硬障碍物的地层，应提前采用引孔、冲孔、爆破或旋挖钻机取石等方法进行预处理，为钢板（钢管）桩插打通畅路径。<br>2. 选用合适桩型：针对硬地质条件，应选择截面刚度大、锁口强度高的钢板桩型号（如Z型桩或高强度U型桩），提高其抗撕裂和抗变形能力。<br>3. 优化施工工艺：采用“预引孔后插打”工艺，有效减小地层阻力；采用“振动锤配合高压射水”的工法，利用高压水软化或冲刷地层，降低沉桩阻力。<br>4. 控制沉桩参数：降低振动锤的频率和激振力，采用慢速低压的方式逐步沉入。<br>5. 桩体检查与处理：在插打过程中，对每根桩的桩身和锁口进行观察，发现轻微变形应及时修复。若发现锁口已撕裂或桩身严重扭曲，应拔出该桩，更换新桩重新插打，严禁将有缺陷的桩体强行打入。"

    "control": "1.实行项目经理-技术负责人-监测组三级责任制，签订安全责任书。<br>2.对监控量测人员进行岗前培训，培训合格方可上岗，并对上岗人员进行监控量测技术交底。<br>3.在编制和评审监控量测方案时结合设计和规范，严格编制和评审。<br>4.认真审查监控量测成果，主要审查：报告内容是否符合设计、规范、方案的规定，监测项目是否全面、数据是否真实、分析方法是否规范（左上图）。<br>5.项目技术、监测负责人，经常性检查监测点位和实施情况（左下图）。"

    "standard": "《铁路隧道监控量测技术规程》Q/CR 9218-2024 第4.3.1 条，隧道浅埋、下穿建（构）筑物地段应在隧道开挖前布设地表沉降观测点。地表沉降测点和隧道内测点宜布置在同一断面里程。",
    "control": "1.编制监控量测点位埋设清单并交底，组织专业人员、设备进行埋设。<br>2.点位埋设后对照里程和交底清单检查，测点周边30cm范围喷涂警示标识，安装可拆卸防护罩（厚度≥3mm钢板），做好标识牌标识保护（左上图、左下图）。<br>3.地表和洞内监测点埋设前应组织测量放样，精确定位。<br>4.拱顶下沉点宜沿隧道中线布设，偏差≤5cm，测点埋入围岩长度≥20cm。<br>5.初支测点喷射混凝土后1h内埋入，标志杆外露端与喷射面平齐（误差±2mm）。<br>6.监控量测点埋设后，监控量测负责人，应全数验收。"

    "control": "1.外观检验前，要明确检验的标准，以便在检验过程中能够准确判断产品是否符合要求。<br>2.外观质量检测采用目测（放大镜、显微镜）、触摸、手撕、尺量（卷尺、直尺、游标卡尺）、称重、不同批次对比等方法进行判断（左上图、左下图）。<br>3.核对材料品种、规格是否与设计一致，检查出厂合格证及检测报告，包装情况，按批次抽样检查外观质量。"

    "standard": "《高速铁路隧道工程施工质量验收标准》TB10753-2018 第8.2.8条，超前小导管的位置、搭接长度和数量应符合设计要求；第8.2.9条，超前小导管与支撑结构的连接应符合设计要求。<br>《公路隧道施工技术规范》JTG/T3660-2020 第15.3.4条，超前小导管尾端应支撑于钢架上，并应焊接牢固。管口应设置止浆阀。",
    "control": "1.提前在钢拱架或掌子面放样导管位置。<br>2.按照设计角度提前安装导向管，控制小导管外插角。<br>3.小导管前端加工成尖锥状，后端焊接加强箍，管壁按设计要求钻注浆孔，孔径、孔距应均匀一致。<br>4.针对钻孔深度采用匹配的钻杆，严格控制小导管间距、进尺（左上图、左下图）。<br>5.合理控制注浆速度，避免浆液流速过快导致流失，如有异常及时停止注浆，采取封堵等措施。<br>6.开挖过程中掌子面局部出现掉块时，应适当加密小导管。"
  },

    "control": "1.施工前测量人员根据设计图纸，明确放样出导向墙位置，埋设导向管，预控管棚角度、间距等参数。<br>2.钻孔作业时，密切观察钻进情况，如钻进速度、扭矩、压力等参数，及时调整钻进参数，防止钻孔偏斜。<br>3.钻孔过程中每钻进一定深度（如5～10m），要对钻孔的偏斜度进行测量，及时纠偏。发现钻孔偏斜超出允许范围，调整钻机角度或采用纠偏钻头，对问题孔道重新打设（左上图、左下图）。<br>4.洞内施作管棚，应提前根据设备规格，考虑工作洞室的轮廓尺寸，有效保证管棚打设角度实现。<br>5.开挖过程中如发现管棚侵限或外插角过大时，应及时报告给建设相关方，制定处置方案后再实施。"

    "standard": "《高速铁路隧道工程施工质量验收标准》TB10753-2018第5.3.3条，预注浆加固效果应符合设计要求。<br>《公路隧道施工技术规范》JTG/T3660-2020第15.2.4条，注浆后应对注浆效果进行检查，不满足设计要求时，应进行补孔注浆。",

  {
    "id": 197,
    "major": "隧道及地下工程",

    "defect": "隧道爆破后成型轮廓与设计开挖轮廓线偏差大、成形差，掌子面不齐整，存在周边眼布置不合理、残孔率低，造成爆破后存在大面积的超挖，或者欠挖的情况。<br>隧道欠挖超限时需要将其凿出，增加了处理时间，降低了掘进效率；超挖造成混凝土超耗；周边破裂面不平顺，又形成应力集中区，导致局部塌方。",
    "standard": "《铁路隧道工程施工质量验收标准》TB10417-2018 第7.2.2 条，隧道开挖轮廓尺寸应符合设计要求，并应严格控制欠挖；围岩完整、石质坚硬时个别突出部位最大欠挖值不大于5cm，每平方米不大于0.1m²。<br>《高速铁路隧道工程施工技术规程》Q/CR9604-2015 第10.2.2条，隧道应严格控制欠挖。隧道个别突出部分（每1m²不大于0.1m²）欠挖不应大于5cm。",
    "control": "1.根据围岩情况，动态调整爆破设计。<br>2.周边炮孔应沿设计爆裂面顶线布置，炮孔做到深浅一致，相互平行，使爆轰力基本均匀（左上图）。<br>3.提高司钻人员钻孔水平，严格控制周边眼的间距，对周边眼实行“定人、定位、定量、定时、定机、定耗、定奖罚标准”的“七定”原则，严格按照测量放线标记的油漆点精确钻孔，控制周边眼的外插角度和深度。<br>4.采用数码电子雷管毫秒延时爆破技术，周边眼采用间隔装药，使用导爆索或者聚能光爆帽，提高爆破效果（左下图）。<br>5.采用炮泥或水袋堵塞炮孔，禁止无堵塞爆破。"

    "title": "开挖台阶长度不符合要求",

    "standard": "《高速铁路隧道工程施工技术规程》Q/CR9604-2015第9.3.4条，采用台阶法开挖隧道时，应根据围岩条件合理确定台阶长度和高度。台阶长度不宜过长，宜控制在一倍洞径以内。<br>《公路隧道施工技术规范》JTG/T3660-2020第7.2.1条，通常，长台阶的台阶长度50m以上；短台阶的台阶长度5～50m；超短台阶的台阶长度3～5m。超短台阶也称微台阶。",
    "control": "1.严格按照设计要求或专家评审意见布设台阶长度、宽度、高度及开挖轮廓线，确保满足设计及施工方案。<br>2.采用台阶法开挖隧道时，应根据围岩条件合理确定台阶长度和高度。台阶长度宜控制在一倍洞径以内（左上图）。<br>3.台阶形成后，各台阶开挖、支护宜平行作业，下台阶开挖，左右侧宜交错进行；除隧道采用的微台阶工法外，严禁同一断面两侧拱脚同时悬空。<br>4.采取环形开挖预留核心土法时，留核心土长度宜为3～5m，宽度宜为隧道开挖宽度1/3～1/2（左下图）。"

  {
    "id": 199,
    "major": "隧道及地下工程",

    "title": "开挖循环进尺过长",
    "defect": "开挖进尺过大导致围岩暴露面积增大、暴露时间延长，超出初期支护承载能力，可能引发塌方或局部掉块。造成超前支护（如小导管、锚杆）覆盖范围不足，形成支护盲区。<br>每循环开挖进尺超标则可能造成围岩不稳定，发生掌子面失稳、局部坍塌，甚至“关门”坍塌；同时在城市浅埋暗挖隧道中易引发地表沉降速率加快，危及周边构建物，存在极大的安全风险。",
    "standard": "《高速铁路隧道工程施工技术规程》Q/CR9604-2015第9.1.3条，隧道开挖应根据围岩级别及其自稳能力控制循环进尺。<br>《公路隧道施工技术规范》JTG/T3660-2020第7.2.3条，台阶法施工应符合下列规定：上台阶开挖每循环进尺，III级围岩宜不大于3m，IV级围岩宜不大于2榀钢架间距，V级围岩宜不大于1榀钢架间距。IV、V级围岩下台阶每循环进尺宜不大于2榀钢架间距。",
    "control": "1.全断面法开挖时，I、II级围岩开挖循环进尺不宜大于3.5m，III级围岩循环进尺不宜大于3.0m；IV、V级围岩在采取有效的超前预加固措施稳定开挖工作面后，若采用全断面法开挖，循环进尺不得大于2m（左上图、左下图）。<br>2.动态调整进尺参数，根据围岩级别优化进尺，循环进尺需满足专家评审后的方案要求。<br>3.严格控制钻孔深度，从根本上控制循环进尺。<br>4.地质预报先行：开挖前采用TSP或地质雷达等手段预报，探明断层、破碎带等不良地质，优化爆破设计，调整开挖循环进尺。<br>5.工序卡控制度：实行“开挖令”审批，需技术、安全共同确认后方可开挖。"

    "id": 200,
    "major": "隧道及地下工程",

    "title": "初支喷射混凝土平整度不达标",
    "defect": "无钢拱架段常见喷射混凝土表面凹凸不平、局部蜂窝麻面、厚度不均、上下开挖部接头处错台等。有钢拱架段常见型钢翼板面喷射混凝土厚度不足，拱架间喷浆面凹陷，呈“排骨状”起伏。<br>喷射混凝土基面不平整、错台会导致后续增加防水板基面处理难度，影响防水质量等。处理不到位常引发衬砌脱空、掉块重大安全风险，危及运营后行车安全。",
    "standard": "《铁路隧道工程施工质量验收标准》TB10417-2018第8.6.4条，喷射混凝土表面应平顺，两突出物之间的深长比（D/L）不应大于1/20。<br>《高速铁路隧道工程施工质量验收标准》TB10753-2018第8.3.5条，喷射混凝土表面平整度应符合两突出物之间的深长比D/L≤1/20的规定。",
    "control": "采用“一填、二刮、三平、四验、五精”工艺施工。<br>1.“一填”，针对拱架背后局部超挖或滑层部位多次、多方位的喷射回填，直到回填至距离钢架表面约5～8cm处。<br>2.“二刮”，利用刮板刮除附着在钢架表面的喷射混凝土（左上图）。<br>3.“三平”，以钢架表面作为参考平面，对钢架间凹坑部位补喷找平（左下图），同时继续利用刮板刮除附着在钢架表面的喷射混凝土（多次）。<br>4.“四验”，利用3D激光扫描仪和水平尺，对初支混凝土表面平整度实测验收，标识欠挖及超挖部位。<br>5.“五精”，根据初支平整度的验收情况，对欠挖部位处理，并对超挖部位补喷、平整度复检，直至验收合格。"

    "standard": "《高速铁路隧道工程施工质量验收标准》TB10753-2018第8.1.4条系统锚杆安装时应设置垫板，垫板应与基面密贴。第8.3.10条，锚杆安装允许偏差应符合表8.3.10的规定。<br>《公路隧道施工技术规范》JTG/T3660-2020第9.3.4条，锚杆原材型号、规格以及各部件质量和技术性能应满足设计要求。锚杆孔位、孔径、孔深及布置形式应满足设计要求。",

    "standard": "《高速铁路隧道工程施工质量验收标准》TB10753-2018第10.5.8条，防水层铺设应与基层密贴、平整，无褶皱、无塌落、无破损。<br>《公路隧道施工技术规范》JTG/T3660-2020第11.3.6条，防水板铺挂时应适当松弛，松弛系数根据超挖情况确定，一般情况取1.1～1.2。",
    "control": "1.防水层铺设应与基层密贴、平整，无褶皱、无塌落、无破损（左上图、左下图）。<br>2.采用“无钉铺设+双焊缝热熔焊接”工艺，焊缝搭接宽度≥15cm，有效焊接宽度≥15mm，避免漏焊、虚焊。<br>3.拱部固定点间距≤0.5m，边墙≤0.8m，凹凸处加密至0.3～0.5m。<br>4.使用“松紧带法”预留5%～8%余量，避免硬拉硬拽。<br>5.防水板铺设施工中发现过紧或过松，都需重新铺挂。<br>6.环向铺设时，下部防水板应压住上部防水板；线路存在纵坡时，下坡防水板压住上坡防水板。"

  {

    "standard": "《高速铁路隧道工程施工质量验收标准》TB10753-2018第10.5.8条，防水板的搭接宽度不应小于150mm。防水板焊接采用双缝焊接，每条焊缝有效宽度不应小于15mm，无漏焊、假焊、焊焦、焊穿。《高速铁路隧道工程施工技术规程》Q/CR9604-2015第11.3.7条，双焊缝焊接质量应采用充气法检查，充气压力在0.25MPa保持15min后，压力下降应小于10%。",
    "control": "1.应做好进场验收，检查出厂合格证、检测报告，并现场抽样复验。<br>2.凸出物处理：切除外露的锚杆头、钢筋头，并用砂浆抹平。<br>3.防水板焊接前应做焊接试验，确定适宜的焊接温度和速度，不得出现烧焦和熔穿现象（左上图）。<br>4.无法采用自动爬焊机焊接的个别局部搭接位置，可采用手持焊枪焊接，焊缝宽度不应小于20mm。<br>5.防水板环向铺设时，下部防水板应压住上部防水板。防水板纵向搭接与环向搭接处应采用“丁”字接头形式（左下图），同时再覆盖一层防水板材加强。<br>6.防水板的焊缝应避开施工缝、变形缝等结构薄弱部位，且焊缝与施工缝的距离不宜小于300mm。"

    "standard": "《高速铁路隧道工程施工质量验收标准》TB10753-2018第9.2.5条，仰拱（底板）和填充应进行实体检测，混凝土应密实、无空洞、杂物。<br>《公路隧道施工技术规范》JTG/T3660-2020第9.7.8条，仰拱、仰拱填充和垫层混凝土浇筑宜采用插入式振捣器振捣密实。",
    "control": "1.仰拱、填充混凝土浇筑前应确认仰拱净空达到设计标准，无杂物、积水等。<br>2.仰拱、填充混凝土具有良好的流动性、保水性，坍落度符合要求。<br>3.推荐采用全弧形仰拱滑动模板，填充与中水沟采用整体式钢模板，仰拱混凝土模板上预留振捣窗口（左上图）。<br>4.仰拱、填充混凝土浇筑时必须加强振捣，宜采用人工+机械的方式，实行“快插慢拔”，以免在混凝土中留下“空隙”。<br>5.填充面应至少收面3次，采用抹子、磨光机等收面（左下图）。<br>6.混凝土收面完成后应及时用土工布等覆盖，对砼洒水养护，砼的养护周期为14天，保证混凝土表面湿润为宜，水温与混凝土表面温度差不得大于15℃。"

    "standard": "《高速铁路隧道工程施工质量验收标准》TB10753-2018，第9.3.2条，隧道边墙基底应无虚渣、杂物及淤泥。<br>《高速铁路隧道工程施工技术规程》Q/CR9604-2015第12.5.10条，施工缝应凿除混凝土表面的水泥砂浆和松软层。凿毛应使露出新鲜混凝土面积不低于75%。",

  },

    "standard": "《地下铁道工程施工质量验收标准》GB/T50299-2018第5.9.8条，基坑开挖边坡不陡于设计文件规定值，基地标高允许偏差-20mm～+10mm，长、宽以轴线控制，不小于设计文件规定值，外放值符合设计文件规定。<br>《建筑地基基础工程施工质量验收标准》GB50202-2018第9.1.2条，在土石方工程开挖施工中，应定期测量和校核设计平面位置、边坡坡率和水平标高。",

    "standard": "《盾构法隧道施工及验收规范》GB50446-2017 第6.6.2 条，中心注浆孔预埋件应进行抗拉拔试验，试验结果应符合设计要求；设计无要求时，抗拔拉力不应低于管片自重的7倍。<br>《预制混凝土衬砌管片生产工艺技术规程》JC/T 2030-2010 第3.10 条，预埋件应符合设计图纸的要求；预埋件与混凝土连接严密，预埋件为非金属件且管片采用蒸汽养护工艺时，应进行耐温试验；预埋件通过蒸养后不得变形。",
    "control": "1.预埋件按设计材质、大小、形状制作，外购或自制的预埋件必须按设计要求经过专检人员验收合格后方可使用。<br>2.在预埋件安装时，采取可靠的固定保护措施及封堵措施，确保其不移位、不变形，防止振捣时堵塞及脱落（左上图）。<br>3.混凝土浇筑前，检查预埋件的固定情况，发现问题及时处理。<br>4.加强混凝土振捣过程控制，避免振捣棒接触预埋件。<br>5.进行预埋件的抗拉拔试验，确保预埋件符合设计规范要求（左下图）。"
  },
  {

    "defect": "混凝土表面出现大量小气泡、小凹坑，且石子大量外露。<br>气泡和蜂窝会导致混凝土表面出现粗糙、不平整的现象，影响美观，内部结构不密实，降低混凝土的抗压强度和耐久性。",
    "standard": "《盾构法隧道施工及验收规范》GB50446-2017 第6.5条，混凝土配合比设计、生产与浇筑、养护应符合设计要求。第6.6条，钢筋混凝土管片外观质量、成品检验应符合设计及规范要求。<br>《预制混凝土衬砌管片》GB/T 22082-2024 第7.2条，管片成品的外观质量应符合规范的规定。",
    "control": "1.严格控制混凝土配合比，调整粉煤灰掺量，以降低混凝土含气率，从而减少混凝土外观气孔。<br>2.调整外加剂掺量，降低混凝土黏度，有利于气泡排出。<br>3.浇筑混凝土前对模具表面杂物清理，然后涂抹脱模剂，脱模剂必须涂抹均匀（左上图）。<br>4.严格控制混凝土浇筑坍落度，加强混凝土浇筑振捣质量控制，浇筑完成后及时二次收面，减少表面气泡的产生（左下图）。"
  },
  {
    "id": 271,
    "major": "隧道及地下工程",
    "chapter": "盾构/TBM隧道",
    "section": "管片制作与生产",
    "title": "管片混凝土外观存在裂缝现象",
    "defect": "养护不到位，混凝土水化过程表面与环境温差过大易出现温度裂缝；坍落度过大或过振，导致混凝土表面浮浆过多出现收缩裂缝。<br>管片裂缝会破坏混凝土的外观，为水分和有害物质的侵入提供通道，降低管片自防水能力，损害混凝土的耐久性。",
    "standard": "《盾构法隧道施工及验收规范》GB50446-2017 第6.5条，混凝土配合比设计、生产与浇筑、养护应符合设计要求。第6.6条，钢筋混凝土管片外观质量、成品检验应符合设计及规范要求。",
    "control": "1.严格控制混凝土配合比，生产前试配，选用水化热较小的混凝土原材料及外加剂，降低混凝土水化热。<br>2.严格控制混凝土坍落度，加强混凝土浇筑振捣质量控制，浇筑完成后及时二次收面，减少表面收缩裂纹。<br>3.当设计对脱模强度有要求时，按照设计要求执行；当设计对脱模强度无要求时，采用吸盘脱模时应不低于15MPa；当采用其他方式脱模时，应不低于20MPa。<br>4.严格控制混凝土养护环境温差，蒸养升温或降温时每小时不得超过15℃，最高温度≤55℃；相对湿度不小于90％，入池水养混凝土表面与水温差不大于20℃，养护大于14天，水养不少于7天（左上图、左下图）。<br>5.减少管片转运次数，加强转运过程保护，控制管片堆放高度和支点。"
  },
  {
    "id": 272,
    "major": "隧道及地下工程",
    "chapter": "盾构/TBM隧道",
    "section": "管片制作与生产",
    "title": "管片色差",
    "defect": "同一环或相邻管片表面颜色不一致，表现为局部或整体的颜色深浅不均、斑块、泛白、泛黄等现象，影响隧道观感质量。<br>隧道内壁颜色不均，降低整体视觉效果。",
    "standard": "《盾构法隧道施工及验收规范》GB50446-2017 第6.9.2条，钢筋混凝土管片外观质量不应有严重缺陷。检查数量：全数检查。检验方法：观察或尺量。",
    "control": "1.尽量采用同一品牌、同一批次的水泥，避免混用，选择颜色稳定的砂石，控制含泥量（≤3%），固定外加剂/掺和配方，避免频繁调整掺量。<br>2.配合比标准化，严格控制水胶比，确保每盘混凝土色泽一致。<br>3.采用均匀振捣，避免过振导致浮浆聚集，使用水性脱模剂，涂抹均匀并清理残留（左上图）。<br>4.控制升温速率（≤15℃/h），避免温度不均导致色差，保持湿度≥90%，防止表面干湿不均，管片堆放时覆盖防雨布，防止污染。<br>5.同一批次或相近批次的管片使用部位应尽量一致，且管片存放周期不宜过长（左下图）。"
  },
  {
    "id": 273,
    "major": "隧道及地下工程",
    "chapter": "盾构/TBM隧道",
    "section": "管片制作与生产",
    "title": "管片运输过程中受损",
    "defect": "在管片垂直、水平运输及吊装过程中，管片产生边缘崩角、表面划痕、局部剥落或裂纹，混凝土保护层脱落等现象。<br>破损管片拼装困难，导致隧道衬砌不密实，增加渗漏水风险；裂缝或钢筋锈蚀会降低管片承载力，影响隧道耐久性；后期需频繁修补，增加施工成本，降低工程施工质量。",
    "standard": "《盾构法隧道施工及验收规范》GB50446-2017 第6.8.3条，在管片翻转、吊装和运输过程中，应采取防护措施。<br>《预制混凝土衬砌管片》GB/T 22082-2024 第11.2条，产品运输时应放在支垫物上，层与层之间用垫木隔开，每层支承点在同一平面上，各层支垫物在同一直线上。",
    "control": "1.使用管片运输专用支架和缓冲材料（如橡胶垫、垫木等）固定、支撑管片，控制堆叠层数，并采用缓冲材料对棱角保护（左上图、左下图）。<br>2.管片叠层堆放时，各层管片间的方木位置保持上下一致。<br>3.运输前将管片固定牢固，水平运输宜选择平稳运输路线，避免急刹或急转弯。<br>4.垂直运输采用尼龙吊索进行管片吊装，避免损伤管片，吊点间距控制在管片长度2/3处，吊索夹角≤90°防止应力集中。<br>5.制定严格的运输及进出场验收流程。"
  },

    "control": "1.根据边界条件选择合适的加固方法，可采用注浆、旋喷、搅拌、冻结、素桩、TRD等各类加固方式（左上图），也可竖直与水平加固相结合，同时还可辅以降水等。<br>2.严格按照设计方案中的加固范围、加固深度、注浆压力、提升速度、水泥掺量等参数施工，并如实记录。<br>3.加固完成后，通过水平探孔、垂直取芯、压水试验等方式，验证端头加固效果（左下图）。<br>4.发现缺陷后，应采取相应补救措施。"

    "title": "导向轨焊接不牢固",

    "standard": "《盾构法隧道施工及验收规范》GB50446-2017 第7.10.4条，盾构空推应符合下列规定：导台或导向轨道水平和竖直方向的精度应满足设计要求。",
    "control": "1.采用全站仪对导轨中心线、标高执行三级复核（放样→初调→终调），确保与盾构机设计轴线重合（左上图）。<br>2.钢环位置导轨焊接在洞门钢环上，并在靠近刀盘一侧做成坡口，方便盾体顺利上导轨。<br>3.钢板接缝处打磨至金属光泽，焊接位置处理干燥后方可焊接。<br>4.焊接时满焊，焊缝无夹渣、高度≥8mm（左下图），并补充探伤检测。<br>5.洞门钢环预埋时，混凝土应浇筑、振捣密实。导轨焊接前，敲击检查钢环背后密实度，并及时注浆处理空洞。<br>6.盾构始发导向轨高程宜高于设计高程1～2cm，盾构接收段导向轨高程宜低于设计高程1～2cm。<br>7.盾构机始发、接收推进过程中，及时监测导轨位移情况，偏差较大时立即停推调整。"

    "standard": "《盾构法隧道施工及验收规范》GB50446-2017 第9.2.4条，管片连接螺栓紧固扭矩应符合设计要求。管片拼装完成，脱出盾尾后，应对管片螺栓及时复紧。第9.2.8条，当在富水稳定岩层掘进时，应采取防止管片上浮、偏移或错台的措施。第9.3.5条，施工中管片拼装允许偏差和检验方法应符合规范的规定。",
    "control": "1.管片拼装过程中，现场土木值班工程师与管片拼装司机全程盯控，确保管片拼装质量。<br>2.采用先径向插入、后纵向推紧的拼装顺序，减少强行挤压（左上图）。<br>3.严格执行螺栓3次紧固制度（拼装后初紧、到达加强环复紧、出盾尾后再次紧固）。<br>4.同步注浆应饱满、均匀，避免局部挤压管片，形成错台（左下图）。<br>5.曲线段、软土段同步注浆浆液应缩短凝固时间，避免因管片壁后支撑不足造成管片错台。"

// ==========================================
// 字体大小控制逻辑
// ==========================================
let currentFontSize = 14;
const fontSizeStep = 1;
const minFontSize = 12;
const maxFontSize = 20;

function updateFontSize(size) {
  if (size < minFontSize) size = minFontSize;
  if (size > maxFontSize) size = maxFontSize;
  currentFontSize = size;
  document.documentElement.style.setProperty('--base-size', size + 'px');
}

document.getElementById('font-decrease').addEventListener('click', () => updateFontSize(currentFontSize - fontSizeStep));
document.getElementById('font-increase').addEventListener('click', () => updateFontSize(currentFontSize + fontSizeStep));
document.getElementById('font-reset').addEventListener('click', () => updateFontSize(14));

// ==========================================
// 图片路径与核心逻辑
// ==========================================
const IMG_EXT = ".png"; 
const IMG_PATH = "images/";

const listContainer = document.getElementById('listContainer');
const globalSearchInput = document.getElementById('globalSearchInput');
const localSearchInput = document.getElementById('localSearchInput');
const resultCount = document.getElementById('resultCount');
const searchModeText = document.getElementById('searchModeText');
const emptyState = document.getElementById('emptyState');

const filterMajor = document.getElementById('filterMajor');
const filterChapter = document.getElementById('filterChapter');
const filterSection = document.getElementById('filterSection');
const filterItem = document.getElementById('filterItem');
const resetFilterBtn = document.getElementById('resetFilterBtn');
const filterPanel = document.getElementById('filterPanel');

const uniqueMajors = [...new Set(manualData.map(d => d.major))];
const chaptersMap = {}; 
const sectionsMap = {}; 
const itemsMap = {};    

manualData.forEach(item => {
  if (!chaptersMap[item.major]) chaptersMap[item.major] = new Set();
  chaptersMap[item.major].add(item.chapter);

  const key = `${item.major}-${item.chapter}`;
  if (!sectionsMap[key]) sectionsMap[key] = new Set();
  sectionsMap[key].add(item.section);

  const itemKey = `${item.major}-${item.chapter}-${item.section}`;
  if (!itemsMap[itemKey]) itemsMap[itemKey] = [];
  itemsMap[itemKey].push(item);
});

function initSelects() {
  uniqueMajors.forEach(m => {
    filterMajor.innerHTML += `<option value="${m}">${m}</option>`;
  });
}

function updateItemSelect() {
  const major = filterMajor.value;
  const chapter = filterChapter.value;
  const section = filterSection.value;
  const currentItemVal = filterItem.value;
  
  filterItem.innerHTML = '<option value="">全部</option>';
  
  let availableItems = [];
  if (major && chapter && section) {
    const itemKey = `${major}-${chapter}-${section}`;
    availableItems = itemsMap[itemKey] || [];
  } else {
    availableItems = manualData.filter(item => {
      if (major && item.major !== major) return false;
      if (chapter && item.chapter !== chapter) return false;
      if (section && item.section !== section) return false;
      return true;
    });
  }
  
  availableItems.forEach(item => {
    filterItem.innerHTML += `<option value="${item.title}">${item.title}</option>`;
  });

  if (currentItemVal && availableItems.some(i => i.title === currentItemVal)) {
    filterItem.value = currentItemVal;
  } else {
    filterItem.value = '';
  }
}

function clearGlobalSearch() {
  globalSearchInput.value = '';
  filterPanel.style.opacity = '1';
  filterPanel.style.pointerEvents = 'auto';
}

filterMajor.addEventListener('change', () => {
  const major = filterMajor.value;
  filterChapter.innerHTML = '<option value="">全部</option>';
  filterSection.innerHTML = '<option value="">全部</option>';
  if (major && chaptersMap[major]) {
    [...chaptersMap[major]].forEach(c => {
      filterChapter.innerHTML += `<option value="${c}">${c}</option>`;
    });
  }
  clearGlobalSearch();
  updateItemSelect();
  renderCards();
});

filterChapter.addEventListener('change', () => {
  const major = filterMajor.value;
  const chapter = filterChapter.value;
  filterSection.innerHTML = '<option value="">全部</option>';
  if (major && chapter) {
    const key = `${major}-${chapter}`;
    if (sectionsMap[key]) {
      [...sectionsMap[key]].forEach(s => {
        filterSection.innerHTML += `<option value="${s}">${s}</option>`;
      });
    }
  }
  clearGlobalSearch();
  updateItemSelect();
  renderCards();
});

filterSection.addEventListener('change', () => {
  clearGlobalSearch();
  updateItemSelect();
  renderCards();
});

filterItem.addEventListener('change', () => {
  clearGlobalSearch();
  renderCards();
});

localSearchInput.addEventListener('input', () => {
  clearGlobalSearch();
  renderCards();
});

resetFilterBtn.addEventListener('click', () => {
  filterMajor.value = '';
  filterChapter.innerHTML = '<option value="">全部</option>';
  filterSection.innerHTML = '<option value="">全部</option>';
  filterItem.innerHTML = '<option value="">全部</option>';
  localSearchInput.value = '';
  globalSearchInput.value = '';
  filterPanel.style.opacity = '1';
  filterPanel.style.pointerEvents = 'auto';
  updateItemSelect();
  renderCards();
});

globalSearchInput.addEventListener('input', () => {
  if (globalSearchInput.value.trim() !== '') {
    filterMajor.value = '';
    filterChapter.innerHTML = '<option value="">全部</option>';
    filterSection.innerHTML = '<option value="">全部</option>';
    filterItem.innerHTML = '<option value="">全部</option>';
    localSearchInput.value = '';
    filterPanel.style.opacity = '0.5';
    filterPanel.style.pointerEvents = 'none';
  } else {
    filterPanel.style.opacity = '1';
    filterPanel.style.pointerEvents = 'auto';
    updateItemSelect();
  }
  renderCards();
});

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, keyword) {
  if (!keyword || !text) return text || '';
  const regex = new RegExp(`(${escapeRegExp(keyword)})`, 'gi');
  return text.replace(regex, '<mark class="hl">$1</mark>');
}

function buildImageHtml(item, type) {
  let fileName = "";
  let altText = "";
  let placeholderName = "";
  
  if (type === 'defect') {
    fileName = `${IMG_PATH}${item.id}-缺陷${IMG_EXT}`;
    altText = "缺陷表征图";
    placeholderName = "【缺陷表征及主要危害】配图";
  } else if (type === 'control1') {
    fileName = `${IMG_PATH}${item.id}-控制点1${IMG_EXT}`;
    altText = "控制点图1";
    placeholderName = "【关键控制点】配图 1";
  } else if (type === 'control2') {
    fileName = `${IMG_PATH}${item.id}-控制点2${IMG_EXT}`;
    altText = "控制点图2";
    placeholderName = "【关键控制点】配图 2";
  }

  return `
    <img src="${fileName}" class="real-img" alt="${altText}" title="点击查看原图" loading="lazy"
         onclick="window.open(this.src, '_blank')"
         onerror="this.outerHTML='<div class=\\'img-placeholder\\'><div class=\\'img-name\\'>${placeholderName}</div><div class=\\'img-size\\'>尺寸：480 × 342</div></div>'">
  `;
}

function renderCards() {
  let html = '';
  let count = 0;
  
  const gKeyword = globalSearchInput.value.trim();
  const lKeyword = localSearchInput.value.trim();
  const selMajor = filterMajor.value;
  const selChapter = filterChapter.value;
  const selSection = filterSection.value;
  const selItemTitle = filterItem.value;

  let activeKeyword = gKeyword || lKeyword;
  let modeStr = '全部内容';
  let shouldScrollToId = null;

  if (gKeyword) {
    modeStr = `全局搜索："${gKeyword}"`;
  } else {
    let parts = [];
    if (selMajor) parts.push(selMajor);
    if (selChapter) parts.push(selChapter);
    if (selSection) parts.push(selSection);
    if (selItemTitle) parts.push(`条: ${selItemTitle}`);
    if (lKeyword) parts.push(`关键字"${lKeyword}"`);
    if (parts.length > 0) modeStr = `筛选：${parts.join(' > ')}`;
  }
  
  searchModeText.textContent = `当前：${modeStr}`;

  manualData.forEach(item => {
    let match = true;
    
    if (gKeyword) {
      const searchStr = `${item.title} ${item.major} ${item.chapter} ${item.section} ${item.defect} ${item.standard} ${item.control}`.toLowerCase();
      if (!searchStr.includes(gKeyword.toLowerCase())) match = false;
    } else {
      if (selMajor && item.major !== selMajor) match = false;
      if (selChapter && item.chapter !== selChapter) match = false;
      if (selSection && item.section !== selSection) match = false;
      if (selItemTitle && item.title !== selItemTitle) match = false;

      if (match && lKeyword) {
        const searchStr = `${item.title} ${item.defect} ${item.standard} ${item.control}`.toLowerCase();
        if (!searchStr.includes(lKeyword.toLowerCase())) match = false;
      }
    }
    
    if (match) {
      count++;
      if (selItemTitle && item.title === selItemTitle) shouldScrollToId = `card-${item.id}`;

      const hlTitle = highlight(item.title, activeKeyword);
      const hlDefect = highlight(item.defect, activeKeyword);
      const hlStandard = highlight(item.standard, activeKeyword);
      const hlControl = highlight(item.control, activeKeyword);

      const defectImgHtml = buildImageHtml(item, 'defect');
      const controlImg1Html = buildImageHtml(item, 'control1');
      const controlImg2Html = buildImageHtml(item, 'control2');

      html += `
        <div class="card" id="card-${item.id}">
          <div class="card-header">
            <div class="title-wrap">
              <div class="index-badge">${item.id.toString().padStart(2, '0')}</div>
              <div class="card-title">${hlTitle}</div>
            </div>
            <div class="tags">
              <span class="tag major">${item.major}</span>
              <span class="tag chapter">${item.chapter}</span>
              <span class="tag section">${item.section}</span>
            </div>
          </div>
          <div class="card-body">
          
            <div class="section defect">
              <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                缺陷表征及主要危害
              </div>
              <div class="section-body-layout">
                <div class="section-content">${hlDefect || '暂无内容'}</div>
                <div class="img-group">
                  ${defectImgHtml}
                </div>
              </div>
            </div>
            
            <div class="section standard">
              <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                规范标准要求
              </div>
              <div class="section-content">${hlStandard || '暂无内容'}</div>
            </div>
            
            <div class="section control">
              <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                关键控制点
              </div>
              <div class="section-body-layout">
                <div class="section-content">${hlControl || '暂无内容'}</div>
                <div class="img-group">
                  ${controlImg1Html}
                  ${controlImg2Html}
                </div>
              </div>
            </div>
            
          </div>
        </div>
      `;
    }
  });

  listContainer.innerHTML = html;
  resultCount.textContent = `共找到 ${count} 条记录`;
  
  if (count === 0) {
    emptyState.style.display = 'block';
    listContainer.style.display = 'none';
  } else {
    emptyState.style.display = 'none';
    listContainer.style.display = 'flex';
    if (shouldScrollToId) {
      setTimeout(() => {
        const el = document.getElementById(shouldScrollToId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }
  }
}

initSelects();
updateItemSelect();
renderCards();

// ==========================================
// 意见反馈弹窗逻辑
// ==========================================
(function () {
  const btn = document.getElementById('feedbackBtn');
  const modal = document.getElementById('feedbackModal');
  const closeBtn = document.getElementById('feedbackClose');

  function openModal() {
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  btn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
  });
})();

// ==========================================
// 返回顶部按钮逻辑
// ==========================================
(function () {
  const backToTopBtn = document.getElementById('backToTopBtn');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
      backToTopBtn.classList.add('show');
    } else {
      backToTopBtn.classList.remove('show');
    }
  });

  backToTopBtn.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  });
})();
</script>
